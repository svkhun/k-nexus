services:
  - type: web
    name: k-nexus-showcase
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app_v2:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v2/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: KBTG_JWT_SECRET
        generateValue: true
